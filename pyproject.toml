[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dse_halal_screener"
version = "0.1.0"
dependencies = ["beautifulsoup4", "requests", "pandas", "pyyaml", "tabulate"]
authors = [
  { name="Omar Faruque Tuhin", email="nadimtuhin@gmail.com" },
]
description = "Screen DSE stocks for halal compounding."
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff"]
